# Vetted dataset registry. License text read 2026-10-27; see docs/VERIFICATION.md.
# license_ok is a machine pre-check; a human must still approve each dataset (TEAM_INPUTS.md "Data").
datasets:
  usaspending_contracts:
    task: procurement_categorization
    source: https://api.usaspending.gov/api/v2/search/spending_by_award/
    license: "USAspending.gov data: free to copy, adapt, redistribute, commercial or non-commercial, subject to the Limitation on Permissible Use of Dun & Bradstreet data"
    license_source: https://github.com/fedspendingtransparency/usaspending-website/blob/master/src/js/components/about/Licensing.jsx
    citation: "USAspending.gov, U.S. Department of Treasury, Bureau of the Fiscal Service, https://www.usaspending.gov. Accessed 27 October 2026."
    license_ok: true
    notes: "Recipient name and other D&B-derived fields are excluded as features (team decision 2026-10-27)."
  psc_manual:
    task: procurement_categorization
    source: https://www.acquisition.gov/sites/default/files/manual/PSC%20April%202025.xlsx
    license: "U.S. federal government work (acquisition.gov)"
    license_ok: true
  loghub_hdfs_v1:
    task: log_anomaly_detection
    source: https://zenodo.org/records/8196385/files/HDFS_v1.zip
    homepage: https://github.com/logpai/loghub
    license: "Loghub license: freely available for research or academic work; must reference the loghub repo URL and cite the Loghub paper; license notice must be included in all copies"
    license_source: https://github.com/logpai/loghub/blob/master/LICENSE
    citation:
      - "Jieming Zhu, Shilin He, Pinjia He, Jinyang Liu, Michael R. Lyu. Loghub: A Large Collection of System Log Datasets for AI-driven Log Analytics. ISSRE 2023."
      - "Wei Xu, Ling Huang, Armando Fox, David Patterson, Michael Jordan. Detecting Large-Scale System Problems by Mining Console Logs. SOSP 2009."
    license_ok: true   # approved by the team 2026-10-27 for the hackathon demo; cite both papers
    notes: "Do not redistribute the raw logs in the repo; download via make demo-data."
  banking77:
    task: support_ticket_routing
    source: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/master/banking_data/
    homepage: https://huggingface.co/datasets/PolyAI/banking77
    license: CC-BY-4.0
    citation: "Casanueva et al. Efficient Intent Detection with Dual Sentence Encoders. 2020. https://arxiv.org/abs/2003.04807"
    license_ok: true

# Live data sourcing for tasks outside the registry (spec 03 §1.1; backend/data_sourcing.py).
# A dataset is offered only when its Hugging Face license tag is on this allowlist; unknown, "other",
# non-commercial and no-derivatives licenses are rejected. The license is checked again when the build starts.
sourcing:
  hf_api: https://huggingface.co/api/datasets
  hf_dataset_page: https://huggingface.co/datasets
  datasets_server: https://datasets-server.huggingface.co
  tavily_domains: [huggingface.co]
  license_allowlist: [cc0-1.0, cc-by-2.0, cc-by-3.0, cc-by-4.0, cc-by-sa-3.0, cc-by-sa-4.0, mit, apache-2.0,
                      bsd, bsd-2-clause, bsd-3-clause, odc-by, odbl, pddl, cdla-permissive-1.0,
                      cdla-permissive-2.0, cdla-sharing-1.0, unlicense, afl-3.0, ecl-2.0]
  hf_results_per_query: 8
  max_candidates_inspected: 8
  max_options_shown: 3
  min_fit: 0.5                    # Nemotron's fit score (0 to 1) below which a dataset isn't offered
  max_rows_fetched: 6000          # rows read from the chosen dataset at build time (sampled across the split)
  rows_page_size: 100             # datasets-server /rows maximum
  min_rows_per_label: 60          # fewer real rows: synthetic examples fill the label (the Data agent drops
                                  # classes under 60 rows before splitting)
  synthetic_per_label: 60         # examples generated per label when no dataset fits
  synthetic_batch: 30             # examples per generation call
  # Public APIs with a recorded license (checked 2026-10-30, docs/VERIFICATION.md). Their items carry no labels for
  # the user's task: the teacher (role teacher_labeling_role) labels them from the task card at build time.
  user_agent: "Synapse/0.1 (https://github.com/havishs9/synapse)"
  teacher_labeling_role: ladder_K_primary   # Nemotron Nano: bulk labeling (config/models.yaml)
  teacher_batch: 25               # items per labeling call
  api_items_fetched: 600          # items read from an API at build time
  api_sample_items: 6             # items shown in the chat as a preview
  apis:
    tvmaze:
      name: TVmaze API
      url: https://api.tvmaze.com
      page: https://www.tvmaze.com/api
      license: cc-by-sa-4.0       # "Use of the TVmaze API is licensed by CC BY-SA" (tvmaze.com/api); credit TVmaze
      citation: "TVmaze (https://www.tvmaze.com), CC BY-SA 4.0"
      covers: "TV shows of every kind, including anime and cartoons: title, type, language, genres and a summary"
      max_pages: 40               # /shows pages of 250 ids; rate limit is at least 20 calls per 10 s per IP
      genres: [Action, Adult, Adventure, Anime, Children, Comedy, Crime, DIY, Drama, Espionage, Family, Fantasy,
               Food, History, Horror, Legal, Medical, Music, Mystery, Nature, Romance, Science-Fiction, Sports,
               Supernatural, Thriller, Travel, War, Western]
    wikidata:
      name: Wikidata
      url: https://query.wikidata.org/sparql
      page: https://www.wikidata.org/wiki/Wikidata:Licensing
      license: cc0-1.0            # structured data is CC0 (wikidata.org/wiki/Wikidata:Licensing)
      citation: "Wikidata (https://www.wikidata.org), CC0 1.0"
      covers: "catalogs of well-known works: title, short description and genres, most-linked items first"
      classes:                    # Wikidata class ids, labels checked on query.wikidata.org
        anime_series: {qid: Q63952888, label: anime television series}
        manga_series: {qid: Q21198342, label: manga series}
        tv_series: {qid: Q5398426, label: television series}
        film: {qid: Q11424, label: film}
        video_game: {qid: Q7889, label: video game}
        novel: {qid: Q8261, label: novel}
        comic: {qid: Q1004, label: comic}
        board_game: {qid: Q131436, label: board game}
        musical_group: {qid: Q215380, label: musical group}
        musical_work: {qid: Q2188189, label: musical work}
