# Build the Synapse image and push it to Nebius Container Registry (docs/TEAM_PLAN.md §2.4).
# Needs the repo secret NEBIUS_REGISTRY_TOKEN (scripts/setup_registry_ci.sh). Tags: :main and :<git sha>.
name: image
on:
  push:
    branches: [main]
    paths: ["backend/**", "config/**", "scripts/**", "artifacts/demo/**", "deploy/**", "requirements.txt",
            "Dockerfile", ".dockerignore", ".github/workflows/image.yml"]
  workflow_dispatch:
concurrency: {group: image, cancel-in-progress: true}
env:
  REGISTRY: cr.eu-west2.nebius.cloud
  IMAGE: cr.eu-west2.nebius.cloud/e04cjwm2bdv5k5b8hc/synapse
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: iam
          password: ${{ secrets.NEBIUS_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
